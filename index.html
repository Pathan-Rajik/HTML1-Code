<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="./biograpy.html">
        <div>
            <label for="">Name:</label>
            <input type="name" placeholder="Enter name" name="name"/><br>
            <label for="">Email:</label>
            <input type="email" placeholder="Enter email" name="email"/><br>
            <label for="">Password:</label>
            <input type="password" placeholder="Enter password" name="password"/><br>
            <label for="">Confirm password:</label>
            <input type="password" placeholder="Enter confirm password" name="password"/><br>
            <label for="">Mobile:</label>
            <input type="tel" placeholder="Enter mobile number" name="number"/><br>
        </div>
        <div>
            <label for="">Gander:</label>
            <input type="radio" id="gmale" name="gmale" value="male" />
            <label for="gmale">Male</label>
            <input type="radio" id="gfemale" name="gmale" value="female"/>
            <label for="gfemale">Female</label>
        </div>
        <div>
            <label for="">Education Details:</label>
            <input type="checkbox" value="10th"/>10th
            <input type="checkbox" value="inter"/>inter
            <input type="checkbox" value="diploma"/>diploma
            <input type="checkbox" value="Btech"/>Btech
        </div>
        <div>
            <select>
                <label for="">City</label>
                <option value="">select city</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Vizag">Vizag</option>
                <option value="Vijayawadw">Vijayawada</option>
            </select> 
        </div> 
        <div>
            <label for="">Address:</label>
            <textarea name="massage" rows="5" cols="30"></textarea>
        </div>
        <button>Register</button>
    </form>
</body>
</html>
